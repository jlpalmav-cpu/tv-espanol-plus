name: TV Espanol Plus - Test and Build APK

on:
  push:
    branches: ["tv-player-v1"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player.yml"
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Unit, security, search and stress tests
        working-directory: android-player
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: android-player
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: android-player
        run: gradle --no-daemon assembleDebug

      - name: APK structure integrity
        working-directory: android-player
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Emulator install and runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android-player
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.epalma.tvespanolplus
            adb shell am start -n com.epalma.tvespanolplus/.MainActivity

            attempt=0
            PID=""
            while [ "$attempt" -lt 60 ]; do
              PID="$(adb shell pidof com.epalma.tvespanolplus 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$PID" ]; then break; fi
              attempt=$((attempt + 1))
              sleep 2
            done
            test -n "$PID"

            attempt=0
            RESUMED=""
            while [ "$attempt" -lt 60 ]; do
              if adb shell dumpsys activity activities 2>/dev/null | grep -E "mResumedActivity|topResumedActivity" | grep -q "com.epalma.tvespanolplus/.MainActivity"; then
                RESUMED=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            test "$RESUMED" = "1"

            sleep 10
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            grep -q 'package="com.epalma.tvespanolplus"' window.xml

            LOGS="$(adb logcat -d -t 800)"
            if echo "$LOGS" | grep -E "FATAL EXCEPTION|ANR in com\.epalma\.tvespanolplus|Process: com\.epalma\.tvespanolplus.*has died"; then
              echo "Application crash/ANR detected during emulator smoke test"
              exit 1
            fi
            echo "Runtime smoke OK: APK installed, process alive, MainActivity resumed, UI hierarchy visible, no fatal crash/ANR."

      - name: Prepare validated v1.4.0 APK
        working-directory: android-player
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TV_Espanol_Plus_Player-v1.4.0.apk
          sha256sum dist/TV_Espanol_Plus_Player-v1.4.0.apk > dist/SHA256.txt
          cat > dist/TEST_STATUS.txt <<'TXT'
          TV Español+ Player v1.4.0
          PASSED BEFORE PUBLICATION: unit/security/search/stress tests + Android lint + APK build + ZIP/APK integrity + API 35 emulator install/runtime smoke test.
          Runtime gate installs the actual APK, starts MainActivity without relying on the very slow unaccelerated emulator's `am start -W` timing, verifies the app process exists, verifies MainActivity reaches resumed state, verifies the app owns the visible UI hierarchy, and rejects fatal crashes or ANRs.
          v1.4: non-blocking background refresh with hard timeout; asynchronous EPG; automatic subcategories for large categories; query-faithful Super Search; one best result per channel; Spanish-first audio/subtitle selection with manual track menu; secure M3U/Basic/Xtream list support; AndroidKeyStore AES-GCM encryption for playlist URL, credentials and cached M3U/XMLTV; protected default list; country folders; dual view; Android TV and mobile safe-area layouts.
          NOTE: a stream can only offer Spanish audio/subtitles if the provider publishes those tracks. The app does not fabricate or translate unavailable tracks.
          Physical-device validation is still recommended for long-session zapping, weak Wi-Fi and dual-decoder differences between TV models.
          TXT

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Espanol-Plus-Player-v1.4.0
          path: android-player/dist/*
          if-no-files-found: error
          retention-days: 30
