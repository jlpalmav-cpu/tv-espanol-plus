name: TV Espanol Plus - Test and Build APK

on:
  push:
    branches: ["tv-player-v1"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player.yml"
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 platforms;android-28"

      - name: Unit, security, parental, search and deduplication tests
        working-directory: android-player
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: android-player
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: android-player
        run: gradle --no-daemon assembleDebug

      - name: APK structure and launcher integrity
        working-directory: android-player
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.epalma.tvespanolplus'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.epalma.tvespanolplus.MainActivity'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt

      - name: Latest Android runtime smoke and responsive rotation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android-player
          script: bash scripts/emulator-smoke.sh

      - name: Android 9 compatibility cold-start smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          disable-animations: true
          working-directory: android-player
          script: bash scripts/emulator-smoke.sh

      - name: Prepare validated v1.5.0 APK
        working-directory: android-player
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TV_Espanol_Plus_Player-v1.5.0.apk
          sha256sum dist/TV_Espanol_Plus_Player-v1.5.0.apk > dist/SHA256.txt
          cat > dist/TEST_STATUS.txt <<'TXT'
          TV Español+ Player v1.5.0
          PASSED BEFORE PUBLICATION:
          - unit/security/search/deduplication/parental-control tests
          - Android lint
          - APK build + ZIP/APK integrity + manifest/launcher verification
          - API 35 install, cold-start, portrait/landscape survival, relaunch and crash/ANR checks
          - API 28 (Android 9) install, cold-start, portrait/landscape survival, relaunch and crash/ANR checks

          v1.5 highlights:
          - startup hardening: background scheduler failure can no longer block application launch
          - responsive Android TV / Google TV / mobile shell
          - large icon+label navigation buttons and clearer focus state
          - menu > submenu > unique channel-list hierarchy with TV preview pane
          - canonical unique channel IDs; virtual Favorites/Recents/Search views do not duplicate the catalog
          - dual view retained
          - parental PIN protection for Adultos 18+ plus optional per-channel locks
          - persistent preferred audio language, subtitle language, subtitle size and UI text size
          - Spanish-first defaults with manual Media3 track selection
          - improved player recovery: transient retries, alternate source fallback and manual retry
          - search computation moved off the main UI thread for smoother typing
          - separate dark sports-inspired background and refreshed Honduras-branded logo

          NOTE: audio/subtitle tracks only exist when the stream provider publishes them. Physical-device validation is still recommended for decoder-specific dual-view limits on individual TV models.
          TXT

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Espanol-Plus-Player-v1.5.0
          path: android-player/dist/*
          if-no-files-found: error
          retention-days: 30
