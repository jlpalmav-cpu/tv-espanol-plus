name: PalmaVision v2.4.7 Large Playlists CI
on:
  workflow_dispatch:
  push:
    branches: [ main, build-palmavision-v240-vod-radio-recovery, build-palmavision-v242-radio-epg-fixes, build-palmavision-v243-consolidated-sources, build-palmavision-v244-ux-radio-logos, build-palmavision-v245-music-controls, build-palmavision-v246-final-polish, build-palmavision-v247-large-playlists ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare verified channel list
        run: mkdir -p app/src/main/assets && cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/
      - name: Source privacy and regression checks
        run: |
          set -euo pipefail
          test "$(grep -c '^#EXTINF:' TV_Espanol_Plus_VERIFICADA.m3u)" -eq 1770
          test "$(grep -c 'tvg-logo=' TV_Espanol_Plus_VERIFICADA.m3u)" -ge 1700
          test "$(grep -c '<uses-permission' app/src/main/AndroidManifest.xml)" -eq 3
          grep -q "versionCode 247" app/build.gradle
          grep -q "versionName '2.4.7'" app/build.gradle
          grep -q 'android:label="PalmaVision"' app/src/main/AndroidManifest.xml
          grep -q 'R.drawable.pv_background_v209' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_logo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showLiveCategories' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showDualView()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showCastScreen()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showParentalChannelManager()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showMovies' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showSeries' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showRadio' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Continuar viendo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'seekVodBy(-10000)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'seekDeltaForRepeat' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'saveVodProgress' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'prepareVodAt(pos)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'loadFromUrlSafe' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'RotatingCache.write' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'acceptableCount' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'saveEpgCache' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'restoreEpgCache' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q '5L\*24L\*60L\*60L\*1000L' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'currentStreamUrl' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Radio · solo música' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'String\[\] opts={"Español","English"}' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioFavorites' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioRecents' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'urlForRetry' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/java/com/epalma/tvespanolplus/CachePolicy.java
          test -s app/src/main/java/com/epalma/tvespanolplus/RotatingCache.java
          test -s app/src/test/java/com/epalma/tvespanolplus/CachePolicyTest.java
          test -s app/src/test/java/com/epalma/tvespanolplus/RotatingCacheTest.java
          test -s app/src/main/java/com/epalma/tvespanolplus/GuideSearch.java
          test -s app/src/test/java/com/epalma/tvespanolplus/GuideSearchTest.java
          grep -q 'Buscar en programación · ej. FC Barcelona' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'GuideSearch.rank' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'setOnEditorActionListener' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'guideIo.submit' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'setAllowCrossProtocolRedirects(true)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Buscar emisora…' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Probando fuente alternativa' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/assets/PalmaVision_Consolidado.json
          ! grep -q '"id": "tubi"' app/src/main/assets/PalmaVision_Consolidado.json
          ! grep -q '"id": "distrotv"' app/src/main/assets/PalmaVision_Consolidado.json
          grep -q '"id": "rtveplay"' app/src/main/assets/PalmaVision_Consolidado.json
          ! grep -q '"id": "rtvcplay"' app/src/main/assets/PalmaVision_Consolidado.json
          grep -q '"logo_url":' app/src/main/assets/PalmaVision_Consolidado.json
          test -s app/src/main/java/com/epalma/tvespanolplus/RadioStreamPolicy.java
          test -s app/src/test/java/com/epalma/tvespanolplus/RadioStreamPolicyTest.java
          grep -q 'RadioStreamPolicy.firstPlayable' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'setAudioAttributes(musicAudio,true)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Versión 1.00' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'guideDateLong' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/java/com/epalma/tvespanolplus/RadioControlPolicy.java
          test -s app/src/test/java/com/epalma/tvespanolplus/RadioControlPolicyTest.java
          grep -q 'toggleRadioPlayback' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioStep(-1)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioStep(1)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'toggleCurrentRadioFavorite' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'toggleRadioMute' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'manualRetryRadio' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'stopRadioPlayback' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioSourceIndex' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'nowPrevButton' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'nowNextButton' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/res/drawable/pv_ic_play.xml
          test -s app/src/main/res/drawable/pv_ic_pause.xml
          test -s app/src/main/res/drawable/pv_ic_stop.xml
          grep -q 'R.drawable.pv_ic_play' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_ic_pause' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_ic_stop' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'secondaryControls.setOrientation(phone?LinearLayout.VERTICAL:LinearLayout.HORIZONTAL)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/java/com/epalma/tvespanolplus/PlaylistStreamReader.java
          test -s app/src/test/java/com/epalma/tvespanolplus/PlaylistStreamReaderTest.java
          grep -q 'PlaylistStreamReader.CappedCacheInputStream' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'PlaylistStreamReader.HARD_MAX_BYTES' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'lista grande' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'Button doSearch=primaryIconBtn("Buscar"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Buscar canal, país o categoría… · Enter' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'search.setImeOptions(EditorInfo.IME_ACTION_SEARCH)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q '"current_verified_entries": 1770' app/src/main/assets/PalmaVision_Consolidado.json
          grep -q 'Gratis On Demand' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showFreeVodProviders' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'verification_max_days' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Vigencia de fuentes' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'isVerificationFresh' app/src/main/java/com/epalma/tvespanolplus/CachePolicy.java
          grep -q 'Audio y subtítulos disponibles' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Desactivados' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'choosePlaybackSubtitleSize' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'onTracksChanged(Tracks tracks)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'x.put("d",p.description)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -RqiE 'globalestv\.online|PalmaVision212' app .github/ci || (echo 'credential leak detected' && exit 1)
      - name: Lint unit tests and release build
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "versionCode='247'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "versionName='2.4.7'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          cp "$APK" PalmaVision_2.4.7.apk
          sha256sum PalmaVision_2.4.7.apk > PalmaVision_2.4.7.sha256.txt
      - name: Package source project
        run: |
          rm -rf app/build .gradle
          zip -qr PalmaVision_2.4.7_Project.zip app branding .github build.gradle settings.gradle gradle.properties TV_Espanol_Plus_VERIFICADA.m3u
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-2.4.7-release
          path: |
            PalmaVision_2.4.7.apk
            PalmaVision_2.4.7.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-2.4.7-project
          path: PalmaVision_2.4.7_Project.zip
  emulator-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare list and APK
        run: |
          mkdir -p app/src/main/assets
          cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/
          gradle --no-daemon :app:assembleRelease
      - name: Emulator UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.epalma.tvespanolplus
            adb shell am start -W -n com.epalma.tvespanolplus/.MainActivity
            sleep 10
            adb shell pidof com.epalma.tvespanolplus | grep -q .
            adb shell dumpsys package com.epalma.tvespanolplus | grep -q 'versionName=2.4.6'