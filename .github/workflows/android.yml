name: Android CI
on:
  push:
    branches: [ build-tvplus ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Prepare verified channel list
        run: mkdir -p app/src/main/assets && cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/
      - name: Validate source and build release
        run: |
          test "$(grep -c '^#EXTINF:' TV_Espanol_Plus_VERIFICADA.m3u)" -eq 1733
          test "$(grep -c '<uses-permission' app/src/main/AndroidManifest.xml)" -eq 2
          gradle :app:lintRelease :app:assembleRelease
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk | head -24
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk PalmaVision-v1.7.1.apk
          sha256sum PalmaVision-v1.7.1.apk > PalmaVision-v1.7.1.sha256.txt
      - name: Package complete source project
        run: |
          zip -r PalmaVision_v1.7.1_Project.zip app build.gradle settings.gradle gradle.properties .github TV_Espanol_Plus_VERIFICADA.m3u -x "app/build/*"
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-v1.7.1-release
          path: |
            PalmaVision-v1.7.1.apk
            PalmaVision-v1.7.1.sha256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-v1.7.1-project
          path: PalmaVision_v1.7.1_Project.zip
          if-no-files-found: error