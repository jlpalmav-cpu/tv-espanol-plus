name: PalmaVision v2.0.9 Dual Parental Cast CI
on:
  push:
    branches: [ build-palmavision-v209-dual-parental-cast ]
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Prepare verified channel list
        run: mkdir -p app/src/main/assets && cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/
      - name: Source, privacy and security checks
        run: |
          set -euo pipefail
          test "$(grep -c '^#EXTINF:' TV_Espanol_Plus_VERIFICADA.m3u)" -eq 1733
          test "$(grep -c 'tvg-logo=' TV_Espanol_Plus_VERIFICADA.m3u)" -ge 1700
          test "$(grep -c '<uses-permission' app/src/main/AndroidManifest.xml)" -eq 2
          grep -q "versionName '2.0.9'" app/build.gradle
          grep -q 'android:label="PalmaVision"' app/src/main/AndroidManifest.xml
          ! grep -q 'PalmaVision · GitHub' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'TV Español+' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'raw.githubusercontent.com' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Pantalla completa' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'CastContext' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q '2.0.9 Dual Parental Cast' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Verificar canal' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'validateCurrent' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'controlBtn("Anterior"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'controlBtn("Siguiente"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'controlBtn("Reintentar"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'controlBtn("Pantalla"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'controlBtn("Favorito"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'controlBtn("Verificar Canal"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'controlBtn("Ajustar"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'controlBtn("Más"' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'armStartupWatchdog' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'setOnItemLongClickListener' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_background' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_logo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.home_movies' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.home_series' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.home_music' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/res/drawable-nodpi/pv_background.webp
          test -s app/src/main/res/drawable-nodpi/pv_logo.webp
          test -s app/src/main/res/drawable-nodpi/home_live.webp
          test -s app/src/main/res/drawable-nodpi/home_movies.webp
          test -s app/src/main/res/drawable-nodpi/home_series.webp
          test -s app/src/main/res/drawable-nodpi/home_music.webp
          grep -q 'PV_SURFACE' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'primaryIconBtn' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'doSearch' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'styleDialog' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Accesos rápidos' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q '⚽' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q '🎬' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showLiveCategories' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'cleanGroup(String raw)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showCountries()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Cine en vivo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Entretenimiento' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Explorar por país' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'rebuildChannelIndex()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'baseForCategory(String cat)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Servidor IPTV / Xtream' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'xtreamM3uUrl' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'source_type' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'ChannelAdapter' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'tvg-logo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'loadXmltv' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'xtreamEpgUrl' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Guía EPG / XMLTV' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'programText(Channel ch)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Nombre de la lista' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showLanguageSettings()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showMediaLanguageMenu()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'ensureSubtitleLayer' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showGuide()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showChannelSchedule' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'preferredAudioLang' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'programGuide' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'detectedPlaylistEpgUrl' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'EPG de la lista' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'HEALTH_OK' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'healthText(Channel ch)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'boolean liveCard' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'EPG con error' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'epgLoading' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'openScreenSettings()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showDualView()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'dualFocus' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showParentalChannelManager()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Enviar a TV' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showCastMenu()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'ACTION_CAST_SETTINGS' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'exitButton.setVisibility(home?View.VISIBLE:View.GONE)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/res/drawable/pv_ic_cast.xml
          ! grep -q 'Salir de PalmaVision' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'dualPlayer' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Vista Doble' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Control parental' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'blockedChannels' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'queueEpg(String url,String label)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'pendingEpgUrl' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_background,this::showLiveCategories' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/res/drawable/pv_ic_dual.xml
          test -s app/src/main/res/drawable/pv_ic_lock.xml
          test -s app/src/main/res/drawable/pv_ic_unlock.xml
          ! grep -q 'Audio del canal' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'Subtítulos del canal' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'nexus-score' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'android:icon="@drawable/pv_logo"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/pv_logo"' app/src/main/AndroidManifest.xml
          grep -q 'Elige un canal en vivo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Próximamente · bajo demanda' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showLivePlayer(String selectedCategory)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showLibraryPlaceholder' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'android.R.drawable' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/res/drawable/pv_ic_search.xml
          test -s app/src/main/res/drawable/pv_ic_sports.xml
          test -s app/src/main/res/drawable/pv_ic_movies.xml
          test -s app/src/main/res/drawable/pv_ic_series.xml
          test -s app/src/main/res/drawable/pv_ic_music.xml
          test -s app/src/main/res/drawable/pv_ic_kids.xml
      - name: Lint, unit task and release build
        run: gradle :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify APK integrity and manifest
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.epalma.tvespanolplus' versionCode='209' versionName='2.0.9'" badging.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions "$APK" | tee permissions.txt
          grep -q "android.permission.INTERNET" permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" permissions.txt
          ! grep -Eq "android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)" permissions.txt
          cp "$APK" PalmaVision-v2.0.9-DUAL-PARENTAL-CAST.apk
          sha256sum PalmaVision-v2.0.9-DUAL-PARENTAL-CAST.apk > PalmaVision-v2.0.9-DUAL-PARENTAL-CAST.sha256.txt
      - name: Package complete source project
        run: |
          zip -r PalmaVision_v2.0.9_DUAL_PARENTAL_CAST_Project.zip app build.gradle settings.gradle gradle.properties .github TV_Espanol_Plus_VERIFICADA.m3u branding -x "app/build/*"
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-v2.0.9-DUAL-PARENTAL-CAST-release
          path: |
            PalmaVision-v2.0.9-DUAL-PARENTAL-CAST.apk
            PalmaVision-v2.0.9-DUAL-PARENTAL-CAST.sha256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-v2.0.9-DUAL-PARENTAL-CAST-project
          path: PalmaVision_v2.0.9_DUAL_PARENTAL_CAST_Project.zip
          if-no-files-found: error
      - name: Android emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r PalmaVision-v2.0.9-DUAL-PARENTAL-CAST.apk
            adb logcat -c
            adb shell am start -n com.epalma.tvespanolplus/.MainActivity
            sleep 8
            adb shell pidof com.epalma.tvespanolplus | tee pid.txt
            test -s pid.txt
            adb shell dumpsys activity activities > activities.txt
            grep -q 'com.epalma.tvespanolplus/.MainActivity' activities.txt
            adb logcat -d -t 1500 > smoke-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|ANR in com.epalma.tvespanolplus|NoClassDefFoundError|ClassNotFoundException' smoke-logcat.txt
