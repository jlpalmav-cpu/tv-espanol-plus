name: PalmaVision Android CI

on:
  push:
    branches: [ build-tvplus ]
  workflow_dispatch:

concurrency:
  group: palmavision-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare verified channel list
        run: mkdir -p app/src/main/assets && cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/

      - name: Source, branding, privacy and feature checks
        run: |
          set -euo pipefail
          test "$(grep -c '^#EXTINF:' TV_Espanol_Plus_VERIFICADA.m3u)" -eq 1733
          test "$(grep -c '<uses-permission' app/src/main/AndroidManifest.xml)" -eq 2
          grep -q "versionName '1.9.4'" app/build.gradle
          grep -q 'android:label="PalmaVision"' app/src/main/AndroidManifest.xml
          grep -q 'x-tvg-url' TV_Espanol_Plus_VERIFICADA.m3u
          grep -q 'showGuide()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'currentProgram' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'healthIcon' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showGuideSettings' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'CastButtonFactory' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'GoogleApiAvailability' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'verifyChannels' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Vista doble' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Enviar a TV' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'play-services-cast-framework:22.2.0' app/build.gradle
          grep -q 'OPTIONS_PROVIDER_CLASS_NAME' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/palmavision_mark.webp
          test -s app/src/main/res/drawable/palmavision_brand_banner.webp
          ! grep -q 'PalmaVision · GitHub' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'TV Español+' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          ! grep -q 'raw.githubusercontent.com' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java

      - name: Lint, unit task and release build
        run: gradle :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify APK integrity, version and permissions
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.epalma.tvespanolplus' versionCode='194' versionName='1.9.4'" badging.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions "$APK" | tee permissions.txt
          grep -q "android.permission.INTERNET" permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" permissions.txt
          ! grep -Eq "android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)" permissions.txt
          cp "$APK" PalmaVision-v1.9.4.apk
          sha256sum PalmaVision-v1.9.4.apk > PalmaVision-v1.9.4.sha256.txt

      - name: Package complete source project
        run: |
          zip -r PalmaVision_v1.9.4_Project.zip app build.gradle settings.gradle gradle.properties .github TV_Espanol_Plus_VERIFICADA.m3u branding -x "app/build/*"

      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-v1.9.4-release
          path: |
            PalmaVision-v1.9.4.apk
            PalmaVision-v1.9.4.sha256.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-v1.9.4-project
          path: PalmaVision_v1.9.4_Project.zip
          if-no-files-found: error

  emulator-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PalmaVision-v1.9.4-release

      - name: Verify downloaded APK
        run: test -s PalmaVision-v1.9.4.apk

      - name: Android emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r PalmaVision-v1.9.4.apk
            adb logcat -c
            adb shell am start -W -n com.epalma.tvespanolplus/.MainActivity | tee launch.txt
            grep -q 'Status: ok' launch.txt
            sleep 6
            adb shell pidof com.epalma.tvespanolplus | tee pid.txt
            test -s pid.txt
            adb shell dumpsys activity activities | grep -q 'com.epalma.tvespanolplus/.MainActivity' || {
              adb logcat -d -t 1000 | tee startup-logcat.txt
              exit 1
            }
            if adb logcat -d -t 1000 | grep -E 'FATAL EXCEPTION|ANR in com.epalma.tvespanolplus'; then exit 1; fi
