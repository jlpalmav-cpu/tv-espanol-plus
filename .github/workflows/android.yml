name: PalmaVision v2.4.0 VOD Radio Recovery CI
on:
  workflow_dispatch:
  push:
    branches: [ main, build-palmavision-v240-vod-radio-recovery ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare verified channel list
        run: mkdir -p app/src/main/assets && cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/
      - name: Source privacy and regression checks
        run: |
          set -euo pipefail
          test "$(grep -c '^#EXTINF:' TV_Espanol_Plus_VERIFICADA.m3u)" -eq 1733
          test "$(grep -c 'tvg-logo=' TV_Espanol_Plus_VERIFICADA.m3u)" -ge 1700
          test "$(grep -c '<uses-permission' app/src/main/AndroidManifest.xml)" -eq 3
          grep -q "versionCode 240" app/build.gradle
          grep -q "versionName '2.4.0'" app/build.gradle
          grep -q 'android:label="PalmaVision"' app/src/main/AndroidManifest.xml
          grep -q 'R.drawable.pv_background_v209' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'R.drawable.pv_logo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showLiveCategories' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showDualView()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showCastScreen()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showParentalChannelManager()' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showMovies' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showSeries' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'showRadio' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Continuar viendo' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'seekVodBy(-10000)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'seekDeltaForRepeat' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'saveVodProgress' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'prepareVodAt(pos)' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'loadFromUrlSafe' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'RotatingCache.write' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'acceptableCount' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'saveEpgCache' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'restoreEpgCache' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q '5L\*24L\*60L\*60L\*1000L' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'currentStreamUrl' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'Radio · solo música' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'String\[\] opts={"Español","English"}' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioFavorites' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'radioRecents' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'urlForRetry' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          test -s app/src/main/java/com/epalma/tvespanolplus/CachePolicy.java
          test -s app/src/main/java/com/epalma/tvespanolplus/RotatingCache.java
          test -s app/src/test/java/com/epalma/tvespanolplus/CachePolicyTest.java
          test -s app/src/test/java/com/epalma/tvespanolplus/RotatingCacheTest.java
          grep -q 'securePutXtreamPassword' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
          grep -q 'secureGetXtreamPassword' app/src/main/java/com/epalma/tvespanolplus/MainActivity.java
      - name: Lint unit tests and release build
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "versionCode='240'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "versionName='2.4.0'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          cp "$APK" PalmaVision_2.4.0.apk
          sha256sum PalmaVision_2.4.0.apk > PalmaVision_2.4.0.sha256.txt
      - name: Package source project
        run: |
          rm -rf app/build .gradle
          zip -qr PalmaVision_2.4.0_Project.zip app branding .github build.gradle settings.gradle gradle.properties TV_Espanol_Plus_VERIFICADA.m3u
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-2.4.0-release
          path: |
            PalmaVision_2.4.0.apk
            PalmaVision_2.4.0.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PalmaVision-2.4.0-project
          path: PalmaVision_2.4.0_Project.zip
  emulator-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare list and APK
        run: |
          mkdir -p app/src/main/assets
          cp TV_Espanol_Plus_VERIFICADA.m3u app/src/main/assets/
          gradle --no-daemon :app:assembleRelease
      - name: Emulator UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            python3 .github/ci/ui_smoke.py
